<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFlow - Personal Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        .anti-gravity-card {
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .anti-gravity-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .spotify-green {
            color: #1DB954;
        }
        .bg-spotify-green {
            background-color: #1DB954;
        }
        .playing {
            background: rgba(29, 185, 84, 0.1) !important;
            border: 1px solid rgba(29, 185, 84, 0.3);
        }
        .playing h3 {
            color: #1DB954;
        }
        .song-card.playing {
            border-left: 2px solid #1DB954;
            background: rgba(255, 255, 255, 0.08);
        }
        /* Fade-in for bottom player */
        footer.active {
            display: flex !important;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        #player-thumbnail {
            transition: opacity 0.3s ease;
        }
        /* Skeleton Shimmer Animation */
        .skeleton {
            background: #1e1e1e;
            background-image: linear-gradient(90deg, #1e1e1e 0px, #2a2a2a 40px, #1e1e1e 80px);
            background-size: 600px;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -600px 0; }
            100% { background-position: 600px 0; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- 1. SIDEBAR KIRI -->
    <aside class="w-64 flex-shrink-0 flex flex-col bg-black bg-opacity-50 border-r border-white border-opacity-5">
        <!-- Logo -->
        <div class="p-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-spotify-green rounded-full flex items-center justify-center">
                    <i data-lucide="music" class="w-5 h-5 text-black"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">MusicFlow</h1>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="px-3 space-y-1">
            <a href="#" class="flex items-center gap-4 px-4 py-3 text-white bg-white bg-opacity-5 rounded-lg transition-all">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="font-medium">Home</span>
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-white hover:bg-opacity-5 rounded-lg transition-all">
                <i data-lucide="search" class="w-5 h-5"></i>
                <span class="font-medium">Search</span>
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-400 hover:text-white hover:bg-white hover:bg-opacity-5 rounded-lg transition-all">
                <i data-lucide="library" class="w-5 h-5"></i>
                <span class="font-medium">Library</span>
            </a>
        </nav>

        <!-- Playlists -->
        <div class="mt-8 px-6">
            <h2 class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-4">Playlists</h2>
            <div id="playlist-list" class="space-y-4 max-h-[40vh] overflow-y-auto custom-scrollbar">
                <!-- Playlists will be rendered here -->
                <div class="flex items-center gap-3 text-gray-400 animate-pulse">
                    <div class="w-8 h-8 bg-gray-800 rounded"></div>
                    <div class="h-3 w-24 bg-gray-800 rounded"></div>
                </div>
            </div>
        </div>

        <!-- Add Playlist Button -->
        <div id="new-playlist-container" class="mt-auto p-4 border-t border-white border-opacity-5">
            <button id="btn-new-playlist" class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-white bg-opacity-5 hover:bg-opacity-10 text-white rounded-xl transition-all">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span class="font-semibold text-sm">New Playlist</span>
            </button>
        </div>
    </aside>

    <!-- 2. MAIN CONTENT -->
    <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
        <!-- Header / Search -->
        <header class="h-20 flex items-center px-8 bg-gradient-to-b from-[#181818] to-transparent sticky top-0 z-10">
            <div class="relative w-full max-w-xl">
                <i id="search-btn" data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 cursor-pointer hover:text-white transition-colors"></i>
                <input id="search-input" type="text" placeholder="Search for songs, artists, or playlists" 
                    class="w-full bg-white bg-opacity-5 border-none rounded-full py-3 pl-12 pr-6 text-sm text-white placeholder-gray-500 focus:ring-2 focus:ring-spotify-green focus:bg-opacity-10 transition-all outline-none">
            </div>
            <div class="ml-auto flex items-center gap-4">
                <button id="btn-notifications" class="w-10 h-10 rounded-full bg-white bg-opacity-5 flex items-center justify-center hover:bg-opacity-10">
                    <i data-lucide="bell" class="w-5 h-5 text-gray-400"></i>
                </button>
                <div id="btn-profile" class="w-10 h-10 rounded-full overflow-hidden border-2 border-white border-opacity-10 cursor-pointer">
                    <img src="https://ui-avatars.com/api/?name=Rezy&background=1DB954&color=fff" alt="Profile">
                </div>
            </div>
        </header>

        <!-- Scrollable Area -->
        <div id="main-content" class="flex-1 overflow-y-auto custom-scrollbar px-8 pb-32">
            <!-- Home Content (Initially loaded) -->
            <div id="home-view">
                <section class="mt-8">
                    <h2 class="text-2xl font-bold mb-6">Welcome Back</h2>
                    <p class="text-gray-400">Search for your favorite songs to get started.</p>
                </section>
                
                <section id="search-results-section" class="mt-12 hidden">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold">Search Results</h2>
                        <button id="btn-clear-search" class="text-xs font-bold text-gray-500 hover:text-white uppercase">Clear</button>
                    </div>
                    <div id="songs-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                        <!-- Search results cards will be injected here -->
                    </div>
                </section>
            </div>

            <!-- Playlist View (Hidden by default) -->
            <div id="playlist-view" class="hidden">
                <!-- Playlist content will be injected here -->
            </div>
        </div>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed bottom-28 right-8 z-50 flex flex-col gap-2"></div>
    </main>

    <!-- 3. BOTTOM PLAYER BAR -->
    <footer class="fixed bottom-0 left-0 right-0 h-24 bg-[#181818] border-t border-white border-opacity-5 flex items-center px-6 z-20">
        <!-- Left: Song Info -->
        <div class="flex items-center gap-4 w-1/3">
            <div class="w-14 h-14 bg-gray-800 rounded-lg overflow-hidden shadow-lg">
                <img id="player-thumbnail" src="https://i.ytimg.com/vi/4NRXx6U8ABQ/mqdefault.jpg" class="w-full h-full object-cover">
            </div>
            <div>
                <h4 id="player-title" class="font-bold text-sm text-white truncate">Blinding Lights</h4>
                <p id="player-artist" class="text-xs text-gray-400">The Weeknd</p>
            </div>
            <button id="btn-heart" class="ml-4 text-gray-400 hover:text-spotify-green">
                <i data-lucide="heart" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Center: Controls -->
        <div class="flex flex-col items-center gap-2 w-1/3">
            <div class="flex items-center gap-6">
                <button id="btn-shuffle" class="text-gray-400 hover:text-white"><i data-lucide="shuffle" class="w-4 h-4"></i></button>
                <button id="btn-backward" class="text-gray-400 hover:text-white flex items-center gap-1">
                    <i data-lucide="chevrons-left" class="w-5 h-5"></i>
                    <span class="text-[10px] font-bold">10s</span>
                </button>
                <button id="btn-prev" class="text-gray-400 hover:text-white"><i data-lucide="skip-back" class="w-5 h-5"></i></button>
                <button id="btn-play" class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-black hover:scale-105 transition-transform">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                </button>
                <button id="btn-next" class="text-gray-400 hover:text-white"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
                <button id="btn-forward" class="text-gray-400 hover:text-white flex items-center gap-1">
                    <span class="text-[10px] font-bold">10s</span>
                    <i data-lucide="chevrons-right" class="w-5 h-5"></i>
                </button>
                <button id="btn-repeat" class="text-gray-400 hover:text-white"><i data-lucide="repeat" class="w-4 h-4"></i></button>
            </div>
            <div class="w-full flex items-center gap-3 px-8">
                <span id="time-current" class="text-[10px] text-gray-500 w-8">0:00</span>
                <div id="progress-container" class="flex-1 h-1 bg-gray-700 rounded-full relative group cursor-pointer">
                    <div id="player-audio" class="absolute left-0 top-0 bottom-0 bg-white group-hover:bg-spotify-green rounded-full w-0"></div>
                    <div id="progress-knob" class="absolute left-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity shadow-lg"></div>
                </div>
                <span id="time-total" class="text-[10px] text-gray-500 w-8">0:00</span>
            </div>
        </div>

        <!-- Right: Volume -->
        <div class="flex items-center justify-end gap-3 w-1/3">
            <i data-lucide="mic-2" class="w-4 h-4 text-gray-400 hover:text-white cursor-pointer"></i>
            <i data-lucide="list-music" class="w-4 h-4 text-gray-400 hover:text-white cursor-pointer"></i>
            <i data-lucide="speaker" class="w-4 h-4 text-gray-400 hover:text-white cursor-pointer"></i>
            <div class="flex items-center gap-2 w-32">
                <i id="volume-icon" data-lucide="volume-2" class="w-4 h-4 text-gray-400"></i>
                <div id="volume-container" class="flex-1 h-1 bg-gray-700 rounded-full relative group cursor-pointer">
                    <div id="volume-slider" class="absolute left-0 top-0 bottom-0 bg-white group-hover:bg-spotify-green rounded-full w-3/4"></div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Playlist Selector Dropdown -->
    <div id="playlist-dropdown" class="fixed hidden bg-[#282828] border border-white border-opacity-10 rounded-lg shadow-2xl z-[60] w-56 py-2">
        <h3 class="px-4 py-2 text-xs font-bold text-gray-500 uppercase tracking-wider border-b border-white border-opacity-5 mb-1">Add to Playlist</h3>
        <div id="dropdown-playlist-list" class="max-h-60 overflow-y-auto custom-scrollbar">
            <!-- Dropdown items will be injected here -->
        </div>
    </div>

    <script src="player.js"></script>
    <script src="app.js"></script>
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicFlow - Premium Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-black: #000;
            --accent-green: #1DB954;
            --sidebar-width: 260px;
            --player-height: 90px;
        }

        body { font-family: 'Outfit', sans-serif; background: #000; color: #fff; margin: 0; overflow: hidden; height: 100vh; }

        .app-container {
            display: grid;
            grid-template-areas: "sidebar main" "player player";
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: 1fr var(--player-height);
            height: 100vh;
        }

        /* Sidebar - Restored & Tidy */
        #sidebar { grid-area: sidebar; background: #000; border-right: 1px solid #1a1a1a; padding: 24px 16px; display: flex; flex-direction: column; }
        
        #main-content-area { grid-area: main; background: radial-gradient(circle at 0% 0%, #1a1a1a 0%, #000 100%); overflow-y: auto; position: relative; }
        
        /* View Sections - STRICT SEPARATION */
        .view-section { padding: 40px; display: none !important; }
        .view-section.active { display: block !important; animation: fadeUp 0.3s ease-out; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Bottom Player - GC & Rapih */
        #main-player-bar { 
            grid-area: player; background: #000; border-top: 1px solid #1a1a1a; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 32px; z-index: 2000;
        }

        .player-info { width: 30%; display: flex; align-items: center; gap: 16px; min-width: 0; }
        .player-controls-box { width: 40%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .player-extra-box { width: 30%; display: flex; justify-content: flex-end; align-items: center; gap: 16px; }

        .nav-link { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-radius: 8px; color: rgba(255,255,255,0.6); font-weight: 600; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { color: #fff; background: #1a1a1a; }
        .nav-link.active { color: var(--accent-green); }

        .playlist-link { display: flex; align-items: center; gap: 12px; padding: 8px 20px; color: rgba(255,255,255,0.4); font-size: 0.85rem; border-radius: 8px; transition: 0.2s; }
        .playlist-link:hover { color: #fff; background: rgba(255,255,255,0.05); }

        .song-card { flex: 0 0 180px; width: 180px; cursor: pointer; transition: 0.3s; min-width: 180px; }
        .song-card .img-container { 
            width: 180px; height: 180px; border-radius: 12px; overflow: hidden; 
            background: #1a1a1a; margin-bottom: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative; /* For play button */
        }
        
        /* Floating Play Button - REFINED */
        .play-overlay {
            position: absolute; bottom: 12px; right: 12px; width: 52px; height: 52px;
            background: var(--accent-green); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; color: #000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); opacity: 0; transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none; /* Make click pass through to parent card */
        }
        .song-card img { 
            width: 100%; height: 100%; object-fit: cover; transition: 0.5s; 
        }
        .song-card:hover .play-overlay { opacity: 1; transform: translateY(0); }
        .play-overlay i { pointer-events: none; }
        .song-card:active .play-overlay { transform: scale(0.9); }
        .song-card:hover img { transform: scale(1.08); filter: brightness(0.6); }
        .song-card:hover { transform: translateY(-5px); }

        .progress-bar-container { width: 100%; height: 4px; background: #333; border-radius: 2px; position: relative; cursor: pointer; }
        .progress-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; transition: width 0.1s linear; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #playlist-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 10000; display: none; align-items: center; justify-content: center; }
        #playlist-modal.active { display: flex; }
        .modal-content { background: #181818; border: 1px solid #333; border-radius: 24px; padding: 40px; width: 100%; max-width: 380px; text-align: center; }
    </style>
</head>
<body class="no-scrollbar">

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside id="sidebar">
            <div class="flex items-center gap-3 px-5 mb-10">
                <div class="w-10 h-10 bg-accent-green rounded-xl flex items-center justify-center flex-shrink-0"><i data-lucide="music" class="w-6 h-6 text-black"></i></div>
                <h1 class="text-2xl font-bold tracking-tight">MusicFlow</h1>
            </div>
            <nav class="space-y-1 w-full">
                <button data-view="home" class="nav-link active w-full"><i data-lucide="home"></i><span>Home</span></button>
                <button data-view="search" class="nav-link w-full"><i data-lucide="search"></i><span>Search</span></button>
                <button data-view="library" class="nav-link w-full"><i data-lucide="library"></i><span>Library</span></button>
            </nav>
            <div class="mt-8 px-5 mb-3 text-[10px] uppercase tracking-[0.2em] text-white/20 font-bold">Your Playlists</div>
            <div id="sidebar-playlists" class="flex-1 overflow-y-auto no-scrollbar w-full"></div>
            <div class="pt-6 mt-4 border-t border-white/5 w-full">
                <button id="btn-create-playlist" class="w-full flex items-center justify-center gap-2 py-3 bg-white/5 hover:bg-white/10 rounded-xl font-bold text-sm transition-all">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-white/50"></i><span>New Playlist</span>
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main id="main-content-area" class="no-scrollbar">
            <!-- BERANDA HANYA BERANDA -->
            <section id="home-view" class="view-section active">
                <h2 class="text-5xl font-black mb-10">Home</h2>
                <div class="mb-14">
                    <h3 class="text-xl font-bold mb-6">Trending Tracks</h3>
                    <div id="trending-scroll" class="flex gap-6 overflow-x-auto pb-4 no-scrollbar"></div>
                </div>
                <div>
                    <h3 class="text-xl font-bold mb-6">Curated For You</h3>
                    <div id="home-playlists-grid" class="flex gap-6 overflow-x-auto pb-4 no-scrollbar"></div>
                </div>
            </section>

            <!-- SEARCH HANYA SEARCH -->
            <section id="search-view" class="view-section">
                <h2 class="text-5xl font-black mb-10">Search</h2>
                <div class="max-w-2xl mb-12 relative">
                    <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 text-white/30"></i>
                    <input id="search-page-input" type="text" placeholder="Artists, songs, or podcasts" class="w-full bg-[#111] border border-white/5 rounded-full py-4 pl-16 pr-6 text-lg outline-none focus:ring-2 focus:ring-accent-green">
                </div>
                <div id="search-results-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6 mt-12"></div>
            </section>

            <!-- LIBRARY HANYA LIBRARY -->
            <section id="library-view" class="view-section">
                <h2 class="text-5xl font-black mb-10">Library</h2>
                <div class="bg-gradient-to-br from-indigo-700 to-purple-900 rounded-3xl p-10 mb-12 relative overflow-hidden">
                    <i data-lucide="heart" class="absolute -right-10 -bottom-10 w-64 h-64 opacity-10 fill-current"></i>
                    <h3 class="text-4xl font-black mb-2">Liked Songs</h3>
                    <p class="text-white/60 text-lg"><span id="liked-count">0</span> songs saved</p>
                    <div class="mt-8 w-14 h-14 bg-accent-green rounded-full flex items-center justify-center text-black shadow-xl"><i data-lucide="play" class="w-8 h-8 fill-current ml-1"></i></div>
                </div>
                <h3 class="text-xl font-bold mb-8">Your Playlists</h3>
                <div id="library-playlists-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
            </section>

            <section id="playlist-detail-view" class="view-section"></section>
        </main>

        <!-- ULTIMATE BOTTOM PLAYER -->
        <footer id="main-player-bar">
            <!-- Left: Song Info & Like -->
            <div class="flex items-center gap-4 min-w-[300px]">
                <div class="w-14 h-14 bg-gray-900 rounded-xl overflow-hidden flex-shrink-0 shadow-lg flex items-center justify-center">
                    <img id="player-thumbnail" src="" class="w-full h-full object-cover hidden" onerror="this.classList.add('hidden'); document.getElementById('player-default-icon').classList.remove('hidden')">
                    <i data-lucide="music" id="player-default-icon" class="w-7 h-7 text-white/20"></i>
                </div>
                <div class="min-w-0 pr-2">
                    <h4 id="player-title" class="font-bold text-sm text-white truncate">Not Playing</h4>
                    <p id="player-artist" class="text-[10px] uppercase tracking-wider text-white/40 truncate">No artist</p>
                </div>
                <button id="btn-like" class="text-white/10 hover:text-accent-green transition flex-shrink-0 ml-2"><i data-lucide="heart" class="w-4 h-4"></i></button>
            </div>

            <!-- Center: Controls & Progress -->
            <div class="flex-1 max-w-[600px] flex flex-col items-center gap-2">
                <div class="flex items-center gap-7">
                    <button id="btn-shuffle" class="text-white/20 hover:text-accent-green transition"><i data-lucide="shuffle" class="w-4 h-4"></i></button>
                    <button id="btn-prev" class="text-white/40 hover:text-white transition"><i data-lucide="skip-back" class="w-6 h-6 fill-current"></i></button>
                    <button id="btn-play" class="w-11 h-11 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition shadow-2xl"><i data-lucide="play" class="w-6 h-6 fill-current ml-0.5"></i></button>
                    <button id="btn-next" class="text-white/40 hover:text-white transition"><i data-lucide="skip-forward" class="w-6 h-6 fill-current"></i></button>
                    <button id="btn-repeat" class="text-white/20 hover:text-accent-green transition"><i data-lucide="repeat" class="w-4 h-4"></i></button>
                </div>
                <div class="w-full flex items-center gap-3">
                    <span id="time-current" class="text-[10px] text-white/30 font-mono w-10 text-right">0:00</span>
                    <div id="player-progress-container" class="progress-bar-container"><div id="player-progress-fill" class="progress-fill"></div></div>
                    <span id="time-total" class="text-[10px] text-white/30 font-mono w-10 text-left">0:00</span>
                </div>
            </div>

            <!-- Right: Extra Controls -->
            <div class="flex justify-end items-center gap-4 min-w-[300px]">
                <i data-lucide="volume-2" class="w-5 h-5 text-white/30"></i>
                <div id="volume-slider-container" class="w-24 h-1 bg-white/10 rounded-full cursor-pointer overflow-hidden"><div id="volume-fill" class="h-full bg-white rounded-full" style="width: 75%"></div></div>
            </div>
        </footer>
    </div>

    <div id="playlist-modal">
        <div class="modal-content">
            <h3 class="text-2xl font-bold mb-8">Create Playlist</h3>
            <input id="playlist-name-input" type="text" placeholder="Playlist Name" class="w-full bg-[#222] border border-white/5 rounded-xl py-4 px-6 text-white mb-8 outline-none focus:ring-2 focus:ring-accent-green text-center">
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 py-4 bg-white/5 hover:bg-white/10 rounded-xl font-bold transition">Cancel</button>
                <button id="btn-save-playlist" class="flex-1 bg-accent-green text-black rounded-xl font-bold hover:scale-105 transition">Create</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed top-8 right-8 z-[11000] flex flex-col gap-3"></div>

    <script src="player.js"></script>
    <script src="app.js"></script>
    <script>
        function closeModal() { document.getElementById('playlist-modal').classList.remove('active'); }
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
